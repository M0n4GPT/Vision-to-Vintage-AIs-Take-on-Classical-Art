<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TF‑Hub Style Transfer</title>
  </head>
  <body>
    <h1>Upload a Content Image</h1>
    <form action="/" method="post" enctype="multipart/form-data">
      <input type="file" name="content" accept="image/*" required>
      <button type="submit">Stylize with a Random Style</button>
    </form>
  </body>
</html>
