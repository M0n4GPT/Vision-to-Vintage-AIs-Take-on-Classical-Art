# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-to-vintage-app
  namespace: vision-to-vintage-staging
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: vision-to-vintage-app
  template:
    metadata:
      labels:
        app: vision-to-vintage-app
    spec:
      containers:
        - name: vision-to-vintage-app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: vision-to-vintage-app
  namespace: vision-to-vintage-staging
spec:
  selector:
    app: vision-to-vintage-app
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
  externalIPs:
    - {{ .Values.service.externalIP | quote }}
