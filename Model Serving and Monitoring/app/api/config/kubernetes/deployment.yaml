apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-to-vintage
  labels:
    app: vision-to-vintage
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vision-to-vintage
  template:
    metadata:
      labels:
        app: vision-to-vintage
    spec:
      containers:
      - name: vision-to-vintage
        image: vision-to-vintage:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        env:
        - name: MODEL_PATH
          value: "/app/models/style_transfer_model"
        - name: STYLE_DIR
          value: "/app/data/styles"
        - name: REFERENCE_DATA_PATH
          value: "/app/data/reference"
        - name: METRICS_PATH
          value: "/app/data/metrics/drift_metrics.json"
        volumeMounts:
        - name: model-volume
          mountPath: /app/models
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: model-volume
        persistentVolumeClaim:
          claimName: model-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vision-to-vintage
spec:
  selector:
    app: vision-to-vintage
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi 