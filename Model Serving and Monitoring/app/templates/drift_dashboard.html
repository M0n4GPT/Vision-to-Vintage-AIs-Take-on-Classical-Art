<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .metric-card {
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .drift-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }
        .drift-detected {
            background-color: #ff4444;
        }
        .no-drift {
            background-color: #00C851;
        }
        #metrics-plot {
            height: 800px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="text-center my-4">Drift Monitoring Dashboard</h1>
        
        <!-- Current Status Card -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card metric-card">
                    <div class="card-header">
                        <h5 class="card-title">Current Status</h5>
                    </div>
                    <div class="card-body">
                        <div id="current-status">
                            <span class="drift-indicator" id="drift-indicator"></span>
                            <span id="status-text">Loading...</span>
                        </div>
                        <div id="last-update" class="text-muted mt-2">Last updated: <span id="timestamp">-</span></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Metrics Plot -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card metric-card">
                    <div class="card-header">
                        <h5 class="card-title">Drift Metrics Over Time</h5>
                    </div>
                    <div class="card-body">
                        <div id="metrics-plot"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Detailed Metrics -->
        <div class="row">
            <div class="col-md-6">
                <div class="card metric-card">
                    <div class="card-header">
                        <h5 class="card-title">Statistical Tests</h5>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Metric</th>
                                    <th>Value</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Kolmogorov-Smirnov Test</td>
                                    <td id="ks-test">-</td>
                                </tr>
                                <tr>
                                    <td>Chi-Square Test</td>
                                    <td id="chi-square">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card metric-card">
                    <div class="card-header">
                        <h5 class="card-title">Distance Metrics</h5>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Metric</th>
                                    <th>Value</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Wasserstein Distance</td>
                                    <td id="wasserstein">-</td>
                                </tr>
                                <tr>
                                    <td>PCA Drift Score</td>
                                    <td id="pca-drift">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket connection
        const ws = new WebSocket(`ws://${window.location.host}/ws/drift-metrics`);
        
        // Update metrics display
        function updateMetrics(data) {
            if (data.status === 'no_data') {
                document.getElementById('status-text').textContent = 'No data available';
                return;
            }
            
            if (data.status === 'error') {
                document.getElementById('status-text').textContent = `Error: ${data.message}`;
                return;
            }
            
            // Update status indicator
            const indicator = document.getElementById('drift-indicator');
            indicator.className = `drift-indicator ${data.drift_detected ? 'drift-detected' : 'no-drift'}`;
            document.getElementById('status-text').textContent = 
                data.drift_detected ? 'Drift Detected' : 'No Drift Detected';
            
            // Update timestamp
            document.getElementById('timestamp').textContent = new Date(data.timestamp).toLocaleString();
            
            // Update metric values
            document.getElementById('ks-test').textContent = data.metrics.ks_test.toFixed(4);
            document.getElementById('chi-square').textContent = data.metrics.chi_square.toFixed(4);
            document.getElementById('wasserstein').textContent = data.metrics.wasserstein.toFixed(4);
            document.getElementById('pca-drift').textContent = data.metrics.pca_drift.toFixed(4);
        }
        
        // WebSocket event handlers
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            updateMetrics(data);
        };
        
        ws.onerror = function(error) {
            console.error('WebSocket error:', error);
            document.getElementById('status-text').textContent = 'Connection error';
        };
        
        // Load initial plot
        fetch('/drift-dashboard/plot')
            .then(response => response.text())
            .then(html => {
                document.getElementById('metrics-plot').innerHTML = html;
            })
            .catch(error => {
                console.error('Error loading plot:', error);
                document.getElementById('metrics-plot').innerHTML = 'Error loading plot';
            });
    </script>
</body>
</html>
