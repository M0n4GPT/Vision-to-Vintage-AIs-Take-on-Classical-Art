networks:
  monitoring-network:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}
  minio_data: {}
  mlflow_data: {}

services:
  # FastAPI application
  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount specific files from host's ./app to container's /app
      - ./app/main.py:/app/main.py
      - ./app/model_registry.py:/app/model_registry.py
      # Mount specific subdirectories from host's ./app to container's /app
      - ./app/api:/app/api
      - ./app/core:/app/core
      - ./app/schemas:/app/schemas
      - ./app/static:/app/static
      - ./app/templates:/app/templates
      # Mount model_management and monitoring into /app in the container
      - ./model_management:/app/model_management
      - ./monitoring:/app/monitoring
      # Keep other essential data/model mounts
      - ./data:/app/data
      - ./data/models:/models 
      # - ./data/styles:/app/data/styles # This is handled by entrypoint.sh copying from /app/data/styles
      - ./data/production:/app/data/production
      - ./data/examples:/app/data/examples
      - ./mlruns:/app/mlruns
    depends_on:
      - minio
      - mlflow
    environment:
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PROMETHEUS_MULTIPROC_DIR=/app/metrics_data # For prometheus_client multiprocess mode
      - MODEL_PATH=/models/model.pt # Explicitly set model path
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO initializer
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb -p myminio/drift || echo 'Bucket drift already exists' &&
      mc mb -p myminio/feedback || echo 'Bucket feedback already exists' &&
      mc mb -p myminio/metrics || echo 'Bucket metrics already exists' &&
      mc mb -p myminio/mlflow-artifacts || echo 'Bucket mlflow-artifacts already exists'
      "
    networks:
      - monitoring-network

  # MinIO for model storage and feedback
  minio:
    image: minio/minio:latest
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MLflow for experiment tracking
  mlflow:
    # image: ghcr.io/mlflow/mlflow:latest # Commented out old image
    build: ./mlflow # CORRECTED: Build from the local Dockerfile
    container_name: mlflow
    ports:
      - "5001:5000"
    command: >
      mlflow server 
      --host=0.0.0.0 
      --port=5000 
      --backend-store-uri=/mlflow/mlruns 
      --default-artifact-root=s3://mlflow-artifacts/ 
      --expose-prometheus=true
    volumes:
      - mlflow_data:/mlflow
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - minio

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
    restart: always
    depends_on:
      - app

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SMTP_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - monitoring-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - prometheus