[server]
http_port = 3000
domain = localhost
root_url = http://localhost:3000/
serve_from_sub_path = false

[security]
admin_user = admin
admin_password = admin
secret_key = your-secret-key

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[paths]
provisioning = /etc/grafana/provisioning

[datasources]
default = prometheus

[metrics]
enabled = true
interval_seconds = 10

[log]
mode = console file
level = info 