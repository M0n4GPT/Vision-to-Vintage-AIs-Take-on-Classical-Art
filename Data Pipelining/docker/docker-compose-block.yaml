name: persist_block

services:
  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: "your-access-key"
      MINIO_ROOT_PASSWORD: "your-secret-key"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    command: server /data --console-address ":9000"
    volumes:
      - /mnt/block/minio_data:/data


  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 your-access-key your-secret-key &&
      if ! mc ls minio/mlflow-artifacts; then
        mc mb minio/mlflow-artifacts &&
        echo 'Bucket mlflow-artifacts created'
      else
        echo 'Bucket mlflow-artifacts already exists';
      fi"

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mlflowdb
    ports:
      - "5432:5432"
    volumes:
      - /mnt/block/postgres_data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.2
    container_name: mlflow
    restart: always
    depends_on:
      - minio
      - minio-create-bucket
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: "your-access-key"
      AWS_SECRET_ACCESS_KEY: "your-secret-key"
    volumes:
      - /mnt/block/mlflow_data:/mlflow
    ports:
      - "8000:8000"
    entrypoint: mlflow
    command: [
      "server",
      "--backend-store-uri=sqlite:///mlflow/mlflow.db",
      "--default-artifact-root=s3://mlflow-artifacts/",
      "--serve-artifacts",
      "--host=0.0.0.0",
      "--port=8000"
    ]








  jupyter:
    image: quay.io/jupyter/pytorch-notebook:pytorch-2.5.1
    container_name: jupyter
    ports:
      - "8888:8888"
    shm_size: 8g
    environment:
      - MLFLOW_TRACKING_URI=http://${HOST_IP}:8000/
      - ARTWORK_DATA_DIR=/mnt/artwork
    volumes:
      - ~/Vision-to-Vintage-AIs-Take-on-Classical-Art:/home/jovyan/work/
      - type: bind
        source: /mnt/object
        target: /mnt/artwork
        read_only: true
    command: >
      bash -c "python3 -m pip install mlflow && start-notebook.sh"
