name: production

services:
  vision_to_vintage:
    build:
      context: /home/cc/Vision-to-Vintage-AIs-Take-on-Classical-Art/ModelTraining/vision-to-vintage-app
      dockerfile: Dockerfile
    container_name: vision_to_vintage
    ports:
      - "9090:9090"
    environment:
      - MINIO_URL=http://minio:9000
      - MINIO_USER=minioadmin
      - MINIO_PASSWORD=minioadmin123
    networks:
      - production_net
    depends_on:
      - minio

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ':9001'
    networks:
      - production_net

  minio-init:
    image: minio/mc
    container_name: minio_init
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set myminio http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p myminio/production || echo 'Bucket already exists'
      "
    networks:
      - production_net

networks:
  production_net:
    external: true

volumes:
  minio_data:
