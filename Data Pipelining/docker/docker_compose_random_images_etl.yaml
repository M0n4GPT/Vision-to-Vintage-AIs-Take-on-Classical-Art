name: random-images-etl

volumes:
  random_images:

version: "3.9"

services:
  extract-random:
    container_name: etl_extract_random
    image: python:3.11
    user: root
    volumes:
      - random_images:/data
    working_dir: /data
    command:
      - bash
      - -c
      - |
        set -e

        echo "Resetting dataset directory..."
        rm -rf RandomRaw random_images_only
        mkdir -p RandomRaw
        cd RandomRaw

        echo "Downloading random image dataset using curl..."
        curl -L -o random-image-sample-dataset.zip https://www.kaggle.com/api/v1/datasets/download/pankajkumar2002/random-image-sample-dataset

        echo "Unzipping dataset..."
        unzip -q random-image-sample-dataset.zip
        rm -f random-image-sample-dataset.zip

        echo "Moving contents to /data/random_images_only..."
        mv * /data/random_images_only
        cd ..
        rm -rf RandomRaw

        echo "Listing contents of /data/random_images_only after extract stage:"
        ls -l /data/random_images_only

  transform-random:
    container_name: etl_transform_random
    image: python:3.11
    volumes:
      - random_images:/data
    working_dir: /data
    command:
      - bash
      - -c
      - |
        set -e

        echo "Installing required libraries..."
        pip install pillow numpy

        echo "Running transform script..."
        python3 -c '
        import os
        import random
        import shutil

        RAW_DIR = "/data/random_images_only"
        OUT_DIR = "/data/random_split"
        SPLIT_NAMES = ["random_train", "random_val", "random_test"]
        SPLIT_RATIOS = [0.7, 0.15, 0.15]

        if not os.path.exists(RAW_DIR):
            raise Exception(f"Missing raw data at {RAW_DIR}")

        os.makedirs(OUT_DIR, exist_ok=True)

        # Step 1: List and shuffle all image files
        all_images = [f for f in os.listdir(RAW_DIR) if f.lower().endswith((".jpg", ".jpeg", ".png"))]
        all_images.sort()  # Optional: sort to make results deterministic before shuffle
        random.seed(42)
        random.shuffle(all_images)

        # Step 2: Compute split sizes with no rounding errors
        n = len(all_images)
        n_train = int(n * SPLIT_RATIOS[0])
        n_val = int(n * SPLIT_RATIOS[1])
        n_test = n - n_train - n_val

        splits = {
            "random_train": all_images[:n_train],
            "random_val": all_images[n_train:n_train + n_val],
            "random_test": all_images[n_train + n_val:]
        }

        print(f"Total images: {n}")
        print(f"Train: {len(splits['random_train'])}, Val: {len(splits['random_val'])}, Test: {len(splits['random_test'])}")

        # Step 3: Copy files to split folders
        for split_name in SPLIT_NAMES:
            split_dir = os.path.join(OUT_DIR, split_name)
            os.makedirs(split_dir, exist_ok=True)
            for fname in splits[split_name]:
                src = os.path.join(RAW_DIR, fname)
                dst = os.path.join(split_dir, fname)
                shutil.copy2(src, dst)
        '

        echo "✅ Dataset successfully split."
        echo "Listing contents of /data/random_split after transform stage:"
        ls -l /data/random_split



  load-random:
    container_name: etl_load_random
    image: rclone/rclone:latest
    volumes:
      - random_images:/data
      - ~/.config/rclone/rclone.conf:/root/.config/rclone/rclone.conf:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$RCLONE_CONTAINER" ]; then
          echo "ERROR: RCLONE_CONTAINER is not set"
          exit 1
        fi

        echo "Uploading random image data..."
        rclone copy /data/random_split chi_tacc:$RCLONE_CONTAINER/random_inputs \
          --progress \
          --transfers=32 \
          --checkers=16 \
          --multi-thread-streams=4 \
          --fast-list

        echo "Listing uploaded directories in object store:"
        rclone lsd chi_tacc:$RCLONE_CONTAINER/random_inputs
