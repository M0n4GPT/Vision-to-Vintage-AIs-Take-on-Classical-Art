version: "3"

volumes:
  artwork:

services:
  extract-data:
    container_name: etl_extract_data
    image: python:3.11
    user: root
    volumes:
      - artwork:/data
      - ~/secrets/kaggle.json:/root/.kaggle/kaggle.json:ro
    working_dir: /data
    command:
      - bash
      - -c
      - |
        set -e

        echo "Installing Kaggle CLI..."
        pip install kaggle --quiet

        echo "Resetting dataset directory..."
        rm -rf raw_data
        mkdir -p raw_data
        cd raw_data

        echo "Downloading dataset from Kaggle..."
        kaggle datasets download -d ikarus777/best-artworks-of-all-time -p .

        echo "Unzipping..."
        unzip -q best-artworks-of-all-time.zip
        rm -f best-artworks-of-all-time.zip

        echo "Contents of raw_data:"
        ls -l /data/raw_data

  transform-data:
    container_name: etl_transform_data
    image: python:3.11
    volumes:
      - artwork:/data
    working_dir: /data/raw_data
    command:
      - bash
      - -c
      - |
        set -e

        pip install pillow --quiet

        echo "Splitting, resizing, and normalizing images..."
        python3 - <<EOF
import os, shutil, random
from PIL import Image

random.seed(42)

src_dir = "/data/raw_data/images"
out_root = "/data/artwork_dataset"
splits = {"train": 0.7, "val": 0.15, "test": 0.15}
size = (256, 256)

os.makedirs(out_root, exist_ok=True)

for artist in os.listdir(src_dir):
    artist_path = os.path.join(src_dir, artist)
    if not os.path.isdir(artist_path): continue

    images = os.listdir(artist_path)
    random.shuffle(images)

    n_total = len(images)
    n_train = int(splits["train"] * n_total)
    n_val = int(splits["val"] * n_total)

    split_data = {
        "train": images[:n_train],
        "val": images[n_train:n_train+n_val],
        "test": images[n_train+n_val:]
    }

    for split, split_imgs in split_data.items():
        split_dir = os.path.join(out_root, split, artist)
        os.makedirs(split_dir, exist_ok=True)
        for img in split_imgs:
            src = os.path.join(artist_path, img)
            dst = os.path.join(split_dir, img)
            try:
                im = Image.open(src).convert('RGB').resize(size)
                im.save(dst)
            except Exception as e:
                print(f"Error processing {src}: {e}")
EOF

        echo "Transformed dataset ready in /data/artwork_dataset"
        ls -l /data/artwork_dataset

  load-data:
    container_name: etl_load_data
    image: rclone/rclone:latest
    volumes:
      - artwork:/data
      - ~/.config/rclone/rclone.conf:/root/.config/rclone/rclone.conf:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$RCLONE_CONTAINER" ]; then
          echo "ERROR: RCLONE_CONTAINER is not set"
          exit 1
        fi

        echo "Cleaning up existing contents of container..."
        rclone delete chi_tacc:$RCLONE_CONTAINER --rmdirs || true

        rclone copy /data/artwork_dataset chi_tacc:$RCLONE_CONTAINER \
        --progress \
        --transfers=32 \
        --checkers=16 \
        --multi-thread-streams=4 \
        --fast-list

        echo "Listing directories in container after load stage:"
        rclone lsd chi_tacc:$RCLONE_CONTAINER
