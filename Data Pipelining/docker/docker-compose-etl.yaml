version: "3.8"
name: artwork-etl

volumes:
  artwork:

services:
  extract-data:
    container_name: etl_extract_data
    image: python:3.11
    user: root
    volumes:
      - artwork:/data
      - ../secrets:/root/.kaggle:ro
    working_dir: /data
    environment:
      - KAGGLE_CONFIG_DIR=/root/.kaggle
    command:
      - bash
      - -c
      - |
        set -e

        echo "Resetting dataset directory..."
        rm -rf raw_data
        mkdir -p raw_data
        cd raw_data

        echo "Downloading dataset from Kaggle..."
        kaggle datasets download -d ikarus777/best-artworks-of-all-time -p .
        unzip -q best-artworks-of-all-time.zip
        rm -f best-artworks-of-all-time.zip

        echo "Listing contents of /data after extract stage:"
        ls -l /data/raw_data

  transform-data:
    container_name: etl_transform_data
    image: python:3.11
    volumes:
      - artwork:/data
    working_dir: /data
    command:
      - bash
      - -c
      - |
        set -e
        pip install --quiet pillow numpy scikit-learn

        python3 - <<EOF
        import os
        import shutil
        import random
        from PIL import Image
        from sklearn.model_selection import train_test_split

        base_dir = "/data/raw_data/images"
        output_dir = "/data/processed"
        os.makedirs(output_dir, exist_ok=True)

        artists = os.listdir(base_dir)
        for artist in artists:
            artist_path = os.path.join(base_dir, artist)
            if not os.path.isdir(artist_path): continue

            images = [f for f in os.listdir(artist_path) if f.endswith(('.jpg', '.jpeg', '.png'))]
            if len(images) < 10: continue

            train, testval = train_test_split(images, test_size=0.3, random_state=42)
            val, test = train_test_split(testval, test_size=0.33, random_state=42)

            for split_name, split_data in [("train", train), ("val", val), ("test", test)]:
                split_dir = os.path.join(output_dir, split_name, artist)
                os.makedirs(split_dir, exist_ok=True)
                for fname in split_data:
                    img_path = os.path.join(artist_path, fname)
                    try:
                        img = Image.open(img_path).convert("RGB").resize((256, 256))
                        img.save(os.path.join(split_dir, fname))
                    except Exception as e:
                        print(f"Skipped {fname}: {e}")
        EOF

        echo "Listing transformed dataset in /data/processed:"
        ls -l /data/processed/train
        ls -l /data/processed/val
        ls -l /data/processed/test

  load-data:
    container_name: etl_load_data
    image: rclone/rclone:latest
    volumes:
      - artwork:/data
      - ~/.config/rclone/rclone.conf:/root/.config/rclone/rclone.conf:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$RCLONE_CONTAINER" ]; then
          echo "ERROR: RCLONE_CONTAINER is not set"
          exit 1
        fi
        echo "Uploading processed data to object store..."
        rclone copy /data/processed chi_tacc:$RCLONE_CONTAINER \
          --progress \
          --transfers=32 \
          --checkers=16 \
          --multi-thread-streams=4 \
          --fast-list

        echo "Upload complete:"
        rclone lsd chi_tacc:$RCLONE_CONTAINER
